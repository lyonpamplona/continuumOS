# Fase 6 — Alembic: migrations versionadas (reprodutíveis e reversíveis).
#
# A URL do banco é resolvida em runtime por migrations/env.py a partir de
# settings.DATABASE_URL (não deixamos credenciais aqui). Uso:
#   alembic upgrade head      # aplica todas as migrations
#   alembic downgrade -1      # reverte a última
#   alembic revision -m "..." # cria uma nova migration

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url é definido dinamicamente em env.py (deixe vazio aqui).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
