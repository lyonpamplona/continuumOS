    <text x="310" y="267" text-anchor="middle">FastAPI</text>
    <rect x="372" y="244" width="140" height="34" rx="6" fill="#1c1c20" stroke="#2a2a30"/>
    <text x="442" y="267" text-anchor="middle">PostgreSQL</text>
    <rect x="522" y="244" width="84" height="34" rx="6" fill="#1c1c20" stroke="#2a2a30"/>
    <text x="564" y="267" text-anchor="middle">Redis</text>
    <rect x="616" y="244" width="120" height="34" rx="6" fill="#1c1c20" stroke="#2a2a30"/>
    <text x="676" y="267" text-anchor="middle">WhatsApp</text>
