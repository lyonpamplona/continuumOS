  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#ff6a00"/>

  <!-- mark -->
  <g transform="translate(92,116)">
    <path d="M0 20 L20 0 L128 0 L128 108 L108 128 L0 128 Z" fill="#ff6a00"/>
    <text x="64" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="90" font-weight="800" fill="#0a0705" text-anchor="middle">C</text>
  </g>

  <!-- wordmark -->
  <text x="256" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="78" font-weight="800" fill="#f2ede6">continnum<tspan fill="#ff6a00">OS</tspan></text>
  <text x="258" y="210" font-family="Consolas,monospace" font-size="21" fill="#9a9188">CRM multi-tenant de atendimento via WhatsApp &#183; white-label</text>

  <!-- pills -->
