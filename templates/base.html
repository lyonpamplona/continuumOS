<!DOCTYPE html>
<html lang="pt-br" data-theme="reator">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>continnumOS</title>
    <meta name="theme-color" content="#070707">
    <meta name="application-name" content="continnumOS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="continnumOS">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- R7: Material Symbols substituido por sprite SVG + icon-adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="/static/pwa-register.js"></script>
    <style>
        :root {
            --bg-base: #070707;
            --bg-1: #0d0d0f;
            --bg-2: #141417;
            --bg-3: #1c1c20;
            --primary: #ff6a00;
            --primary-2: #ffb020;
            --primary-hover: #ff8324;
            --wa-green: #00a884;
            --text-main: #f2ede6;
            --text-muted: #9a9188;
            --danger: #ff4d5e;
            --border: #2a2a30;
            --border-2: #3a3a42;
            --grid: rgba(255, 106, 0, .05);
            --font-main: 'JetBrains Mono', ui-monospace, monospace;
            --font-disp: 'Space Grotesk', 'JetBrains Mono', monospace;
            --radius-lg: 4px;
            --radius-md: 3px;
            --radius-sm: 2px;
            --bevel: 12px;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-base);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 34px 34px;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::selection { background: var(--primary); color: #0a0705; }
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: var(--border-2); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
    <link rel="stylesheet" href="/static/console-blueprint.css">
    <link rel="stylesheet" href="/static/console-shell.css">
    <script>try{var t=localStorage.getItem("cnn_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <script defer src="/static/theme-engine.js"></script>
</head>
<body>
    {% include "partials/icon_sprite.html" %}
    <script defer src="/static/icon-adapter.js"></script>
    {% block content %}{% endblock %}
</body>
</html>
