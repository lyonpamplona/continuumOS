{% extends "base.html" %}
{% block content %}
<style>
    .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; position: relative; }
    .login-wrapper::before {
        content: "CONTINNUM // OS"; position: absolute; top: 22px; left: 24px;
        font-size: .62rem; letter-spacing: .38em; color: var(--text-muted); opacity: .55;
    }
    .login-wrapper::after {
        content: "SECURE ACCESS TERMINAL"; position: absolute; bottom: 22px; right: 24px;
        font-size: .58rem; letter-spacing: .3em; color: var(--text-muted); opacity: .45;
    }
    .login-panel {
        background: var(--bg-1);
        border: 1px solid var(--border-2);
        clip-path: polygon(0 16px, 16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
        padding: 42px 38px 38px;
        width: 100%;
        max-width: 384px;
        box-shadow: 0 20px 60px rgba(0,0,0,.55);
        position: relative;
    }
    .login-panel::before {
        content: ""; position: absolute; left: 0; top: 16px; width: 3px; height: 42px; background: var(--primary); box-shadow: 0 0 14px var(--grid);
    }
    .login-tag { font-size: .58rem; letter-spacing: .32em; color: var(--primary); text-transform: uppercase; margin-bottom: 16px; }
    .login-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .brand-mark {
        width: 52px; height: 52px; display: grid; place-items: center; flex: 0 0 auto;
        background: var(--primary); color: #0a0705; font-weight: 800; font-size: 1.5rem;
        clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }
    .brand-name { font-family: var(--font-disp); font-weight: 700; font-size: 1.28rem; color: var(--text-main); letter-spacing: .02em; }
    .brand-sub { color: var(--text-muted); font-size: .68rem; margin-top: 3px; letter-spacing: .06em; }
    .login-label { display: block; margin-bottom: 8px; font-size: .64rem; text-transform: uppercase; letter-spacing: .16em; color: var(--text-muted); }
    .field-wrap { position: relative; margin-bottom: 18px; }
    .field-wrap .material-symbols-outlined { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 20px; }
    .login-input {
        width: 100%; min-height: 48px; padding: 0 14px 0 44px;
        background: var(--bg-2); border: 1px solid var(--border);
        color: var(--text-main); border-radius: 0;
        box-sizing: border-box; font-family: var(--font-main); font-size: 16px !important; transition: .18s;
    }
    .login-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(255,106,0,.14); }
    .login-btn {
        background: var(--primary); border: 1px solid var(--primary); color: #0a0705;
        padding: 14px; width: 100%; border-radius: 0; cursor: pointer; transition: .18s;
        clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
        font-family: var(--font-main); font-weight: 700; font-size: 14px; margin-top: 8px; text-transform: uppercase; letter-spacing: .08em;
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover { background: var(--primary-hover); }
    .error-msg {
        color: var(--danger); text-align: left; font-size: .78rem; margin-bottom: 20px;
        background: rgba(255,77,94,.10); padding: 11px 13px; border-radius: 0;
        border: 1px solid rgba(255,77,94,.34); border-left: 3px solid var(--danger);
        display: flex; align-items: center; gap: 8px;
    }
</style>
<div class="login-wrapper">
    <div class="login-panel">
        <div class="login-tag">// autenticação requerida</div>
        <div class="login-brand">
            <div class="brand-mark">C</div>
            <div>
                <div class="brand-name">continnumOS</div>
                <div class="brand-sub">CRM &middot; Atendimento WhatsApp</div>
            </div>
        </div>
        {% if error %}<div class="error-msg"><span class="material-symbols-outlined" style="font-size:18px">error</span> error </div>{% endif %}
        <form action="/login" method="post">
            <label class="login-label">Usuário</label>
            <div class="field-wrap">
                <span class="material-symbols-outlined">person</span>
                <input class="login-input" type="text" name="username" autocomplete="off" required>
            </div>
            <label class="login-label">Senha</label>
            <div class="field-wrap">
                <span class="material-symbols-outlined">lock</span>
                <input class="login-input" type="password" name="password" required>
            </div>
            <button class="login-btn" type="submit"><span class="material-symbols-outlined" style="font-size:18px">login</span> Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
